[project]
name = "local-video-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kannan S", email = "kannan.s@powerschool.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "ffmpeg-python>=0.2.0",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
local-video-platform = "local_video_platform:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
